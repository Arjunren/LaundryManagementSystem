name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_DATABASE: laundry_test, MYSQL_USER: laundry, MYSQL_PASSWORD: laundry_test, MYSQL_ROOT_PASSWORD: root_test }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot_test" --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Verify MySQL migrations and seeders
        env: { DB_CONNECTION: mysql, DB_HOST: 127.0.0.1, DB_PORT: 3306, DB_DATABASE: laundry_test, DB_USERNAME: laundry, DB_PASSWORD: laundry_test }
        run: php artisan migrate:fresh --seed --force
      - run: composer test
      - run: composer audit
